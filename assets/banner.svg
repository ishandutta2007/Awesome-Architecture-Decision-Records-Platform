<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .bg-rect { fill: url(#bgGrad); }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 32px; fill: url(#textGrad); }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 15px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #38bdf8; letter-spacing: 1.5px; }
    .glow-orb { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .p1 { animation: floatParticle 4s ease-in-out infinite; }
    .p2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .wire-line { stroke: #4f46e5; stroke-width: 1.5; stroke-dasharray: 8 6; animation: dashMove 20s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="800" height="220" rx="12" class="bg-rect" />

  <!-- Animated Dynamic Background Elements -->
  <circle cx="150" cy="60" r="90" fill="#3b82f6" opacity="0.15" class="glow-orb" />
  <circle cx="680" cy="160" r="110" fill="#8b5cf6" opacity="0.15" class="glow-orb" />

  <!-- Architecture Grid Lines -->
  <path d="M 50,0 V 220 M 150,0 V 220 M 250,0 V 220 M 350,0 V 220 M 450,0 V 220 M 550,0 V 220 M 650,0 V 220 M 750,0 V 220" stroke="url(#gridGrad)" stroke-width="0.5" />
  <path d="M 0,40 H 800 M 0,90 H 800 M 0,140 H 800 M 0,190 H 800" stroke="url(#gridGrad)" stroke-width="0.5" />

  <!-- Dynamic Connecting Nodes (Background) -->
  <path d="M 80 180 L 180 140 L 280 170 L 380 120 L 520 160 L 680 110 L 740 150" fill="none" class="wire-line" opacity="0.4" />

  <circle cx="180" cy="140" r="4" fill="#38bdf8" class="p1" />
  <circle cx="380" cy="120" r="5" fill="#818cf8" class="p2" />
  <circle cx="680" cy="110" r="4" fill="#c084fc" class="p3" />

  <!-- Foreground Content Container -->
  <g transform="translate(40, 45)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" class="badge-text">🏛️ ARCHITECTURE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="62" class="title-text" filter="url(#glow)">Awesome ADR Platforms</text>

    <!-- Subtitle -->
    <text x="0" y="94" class="subtitle-text">Curated SaaS Products &amp; Open-Source Tools for Architecture Decision Records</text>

    <!-- Bottom Features Chips -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="130" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" opacity="0.9" />
      <text x="10" y="15" font-family="'Segoe UI', sans-serif" font-size="11" fill="#38bdf8">⚡ C4 &amp; MADR Specs</text>

      <rect x="140" y="0" width="135" height="22" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="0.8" opacity="0.9" />
      <text x="150" y="15" font-family="'Segoe UI', sans-serif" font-size="11" fill="#818cf8">📦 Open-Source CLIs</text>

      <rect x="285" y="0" width="150" height="22" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="0.8" opacity="0.9" />
      <text x="295" y="15" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c084fc">🏢 Enterprise EA Platforms</text>
    </g>
  </g>
</svg>
