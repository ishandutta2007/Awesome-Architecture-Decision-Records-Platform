<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="220" viewBox="0 0 800 220"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="gridGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#818cf8" stop-opacity=".3"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-15px) translateX(10px);opacity:.8}}@keyframes dashMove{0%{stroke-dashoffset:100}}.bg-rect{fill:url(#bgGrad)}.badge-text,.subtitle-text,.title-text{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title-text{font-weight:800;font-size:32px;fill:url(#textGrad)}.subtitle-text{font-weight:500;font-size:15px;fill:#94a3b8}.badge-text{font-weight:600;font-size:11px;fill:#38bdf8;letter-spacing:1.5px}.glow-orb{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.p1{animation:floatParticle 4s ease-in-out infinite}.p2{animation:floatParticle 5s ease-in-out infinite 1s}.p3{animation:floatParticle 6s ease-in-out infinite 2s}.wire-line{stroke:#4f46e5;stroke-width:1.5;stroke-dasharray:8 6;animation:dashMove 20s linear infinite}</style><rect width="800" height="220" class="bg-rect" rx="12"/><circle cx="150" cy="60" r="90" fill="#3b82f6" class="glow-orb" opacity=".15"/><circle cx="680" cy="160" r="110" fill="#8b5cf6" class="glow-orb" opacity=".15"/><path stroke="url(#gridGrad)" stroke-width=".5" d="M 50,0 V 220 M 150,0 V 220 M 250,0 V 220 M 350,0 V 220 M 450,0 V 220 M 550,0 V 220 M 650,0 V 220 M 750,0 V 220"/><path stroke="url(#gridGrad)" stroke-width=".5" d="M 0,40 H 800 M 0,90 H 800 M 0,140 H 800 M 0,190 H 800"/><path fill="none" d="M 80 180 L 180 140 L 280 170 L 380 120 L 520 160 L 680 110 L 740 150" class="wire-line" opacity=".4"/><circle cx="180" cy="140" r="4" fill="#38bdf8" class="p1"/><circle cx="380" cy="120" r="5" fill="#818cf8" class="p2"/><circle cx="680" cy="110" r="4" fill="#c084fc" class="p3"/><g transform="translate(40, 45)"><rect width="220" height="24" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="12"/><text x="12" y="16" class="badge-text">🏛️ ARCHITECTURE ECOSYSTEM</text><text x="0" y="62" class="title-text" filter="url(#glow)">Awesome ADR Platforms</text><text x="0" y="94" class="subtitle-text">Curated SaaS Products &amp; Open-Source Tools for Architecture Decision Records</text><g transform="translate(0, 115)"><rect width="130" height="22" x="0" y="0" fill="#0f172a" stroke="#38bdf8" stroke-width=".8" opacity=".9" rx="6"/><text x="10" y="15" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11">⚡ C4 &amp; MADR Specs</text><rect width="135" height="22" x="140" y="0" fill="#0f172a" stroke="#818cf8" stroke-width=".8" opacity=".9" rx="6"/><text x="150" y="15" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="11">📦 Open-Source CLIs</text><rect width="150" height="22" x="285" y="0" fill="#0f172a" stroke="#c084fc" stroke-width=".8" opacity=".9" rx="6"/><text x="295" y="15" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="11">🏢 Enterprise EA Platforms</text></g></g></svg>